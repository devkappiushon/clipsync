<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipSync</title>
<meta name="description" content="ClipSync: teclado, mouse e área de transferência compartilhados entre os seus computadores.">
<meta name="author" content="João Pedro · montesouza.dev">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231f4e8c' stroke-width='2' stroke-linejoin='round'%3E%3Crect x='3' y='3' width='12' height='12' rx='3'/%3E%3Crect x='9' y='9' width='12' height='12' rx='3' fill='%231f4e8c'/%3E%3C/svg%3E">
<script src="js/tema-inicial.js"></script>
<link rel="preload" href="fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/telas/onboarding.css">
<link rel="stylesheet" href="css/telas/dispositivos.css">
<link rel="stylesheet" href="css/telas/pareamento.css">
<link rel="stylesheet" href="css/telas/layout.css">
<link rel="stylesheet" href="css/telas/clipboard.css">
<link rel="stylesheet" href="css/telas/diagnostico.css">
<link rel="stylesheet" href="css/telas/preferencias.css">
</head>
<body>

<a class="pular" href="#conteudo">Ir para o conteúdo</a>

<div class="app" id="app" data-lateral="visivel">
  <aside class="lateral" id="lateral">
    <div class="marca">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="12" height="12" rx="3"/><rect x="9" y="9" width="12" height="12" rx="3" fill="currentColor"/></svg>
      ClipSync
    </div>

    <nav aria-label="Seções">
      <ul class="menu" id="menu">
        <li><a href="#/dispositivos" data-nav="dispositivos"><svg class="icone" aria-hidden="true"><use href="#i-dispositivos"/></svg>Dispositivos</a></li>
        <li><a href="#/layout" data-nav="layout"><svg class="icone" aria-hidden="true"><use href="#i-layout"/></svg>Layout de telas</a></li>
        <li><a href="#/clipboard" data-nav="clipboard"><svg class="icone" aria-hidden="true"><use href="#i-clipboard"/></svg>Clipboard</a></li>
        <li><a href="#/diagnostico" data-nav="diagnostico"><svg class="icone" aria-hidden="true"><use href="#i-diagnostico"/></svg>Diagnóstico</a></li>
        <li><a href="#/preferencias" data-nav="preferencias"><svg class="icone" aria-hidden="true"><use href="#i-preferencias"/></svg>Preferências</a></li>
      </ul>
    </nav>

    <div class="estado-lateral" aria-label="Estado da malha">
      <dl>
        <div>
          <dt>Esta máquina</dt>
          <dd><strong id="maquina-nome">Carregando</strong> <span class="mono muted" id="maquina-impressao"></span></dd>
        </div>
        <div>
          <dt>Malha</dt>
          <dd><span id="malha" role="status"><span class="esqueleto"></span></span></dd>
        </div>
      </dl>
      <button class="btn btn--secundario btn--bloco" id="pausar" type="button" aria-pressed="false" disabled>
        <span class="btn__rotulo" id="pausar-rotulo">Pausar tudo</span>
        <kbd>Win+Alt+P</kbd>
      </button>
    </div>
  </aside>

  <main class="conteudo" id="conteudo" tabindex="-1"></main>
</div>

<noscript>O ClipSync precisa de JavaScript ligado para mostrar a interface.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>

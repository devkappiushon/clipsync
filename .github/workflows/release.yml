name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            ext: zip

    steps:
      - uses: actions/checkout@v7

      # Só actions oficiais e sem cache (contrato §11 regra 9): um cache restaurado
      # de PR poderia envenenar o binário publicado. O rustup do runner instala a
      # toolchain fixada em rust-toolchain.toml na primeira chamada.
      - name: toolchain fixada
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          cargo --version

      - name: tag confere com a versão do workspace
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v${version}" != "${TAG}" ]; then
            echo "tag ${TAG} difere da versão ${version} do Cargo.toml" >&2
            exit 1
          fi

      # CRT estática no Windows: sem isso o .exe exige o VCRUNTIME140.dll do
      # VC++ Redistributable, que um Windows limpo pode não ter.
      - name: cargo build --release
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release -p clipsync-cli --locked --target ${{ matrix.target }}

      - name: empacota (linux)
        if: matrix.name == 'linux-x86_64'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          stage="clipsync-${TAG}-linux-x86_64"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/clipsync" "$stage/"
          cp README.md "$stage/"
          tar -czf "${stage}.tar.gz" -C "$stage" clipsync README.md

      - name: empacota (windows)
        if: matrix.name == 'windows-x86_64'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $stage = "clipsync-$env:TAG-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/clipsync.exe" "$stage/"
          Copy-Item README.md "$stage/"
          Compress-Archive -Path "$stage/clipsync.exe", "$stage/README.md" -DestinationPath "$stage.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: clipsync-*-${{ matrix.name }}.${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: publica release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum clipsync-* > SHA256SUMS

      - name: notas do release
        run: |
          cat > notes.md <<'EOF'
          Binários de linha de comando para Linux e Windows.

          - Linux (X11 e XWayland): malha QUIC, pareamento, clipboard e teclado e mouse experimentais.
          - Windows: malha QUIC, pareamento e clipboard de texto. Teclado e mouse ainda não estão disponíveis nesta versão.

          Confira o SHA-256 em SHA256SUMS antes de executar.
          EOF

      - name: gh release create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "ClipSync $TAG" --notes-file notes.md

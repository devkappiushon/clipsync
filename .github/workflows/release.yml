name: release

on:
  push:
    tags: ["v*"]
  # Disparo manual: gera os pacotes como artefatos para conferir antes da tag.
  # Não publica release (o job publica só roda em tag).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Bibliotecas do WebKitGTK e da bandeja para compilar a casca Tauri (§12.8.3).
      - name: dependências do sistema (linux)
        if: matrix.name == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev pkg-config build-essential file patchelf

      # Só actions oficiais e sem cache (contrato §11 regra 9): um cache restaurado
      # de PR poderia envenenar o binário publicado. O rustup do runner instala a
      # toolchain fixada em rust-toolchain.toml na primeira chamada.
      - name: toolchain fixada
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          cargo --version

      - name: tag confere com a versão do workspace
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$REF_TYPE" = "tag" ] && [ "v${version}" != "$REF_NAME" ]; then
            echo "tag ${REF_NAME} difere da versão ${version} do Cargo.toml" >&2
            exit 1
          fi
          echo "TAG=v${version}" >> "$GITHUB_ENV"

      # CRT estática no Windows: sem isso o .exe exige o VCRUNTIME140.dll do
      # VC++ Redistributable, que um Windows limpo pode não ter.
      - name: cargo build --release (cli)
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release -p clipsync-cli --locked --target ${{ matrix.target }}

      - name: empacota a cli (linux)
        if: matrix.name == 'linux-x86_64'
        run: |
          set -euo pipefail
          stage="clipsync-${TAG}-linux-x86_64"
          mkdir -p "$stage" dist
          cp "target/${{ matrix.target }}/release/clipsync" "$stage/"
          cp README.md "$stage/"
          tar -czf "dist/${stage}.tar.gz" -C "$stage" clipsync README.md

      - name: empacota a cli (windows)
        if: matrix.name == 'windows-x86_64'
        shell: pwsh
        run: |
          $stage = "clipsync-$env:TAG-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $stage, dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/clipsync.exe" "$stage/"
          Copy-Item README.md "$stage/"
          Compress-Archive -Path "$stage/clipsync.exe", "$stage/README.md" -DestinationPath "dist/$stage.zip"

      # Versão fixada (§12.8.4). Compila do crates.io com o Cargo.lock dele.
      - name: instala o tauri-cli
        shell: bash
        run: cargo install tauri-cli --version =2.12.4 --locked

      # A CRT estática do app vem do tauri-build (build.windows.staticVCRuntime,
      # ligado por padrão). NO_STRIP evita o strip do linuxdeploy em bibliotecas
      # com seções que a versão embutida dele não conhece.
      - name: cargo tauri build (linux)
        if: matrix.name == 'linux-x86_64'
        working-directory: crates/clipsync-app
        env:
          NO_STRIP: "true"
        run: cargo tauri build --ci --bundles appimage,deb -- --locked

      - name: cargo tauri build (windows)
        if: matrix.name == 'windows-x86_64'
        working-directory: crates/clipsync-app
        shell: bash
        run: cargo tauri build --ci --bundles msi,nsis -- --locked

      - name: renomeia os pacotes do app (linux)
        if: matrix.name == 'linux-x86_64'
        run: |
          set -euo pipefail
          um() { [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "esperava um arquivo, achei: $*" >&2; exit 1; }; echo "$1"; }
          cp "$(um target/release/bundle/appimage/*.AppImage)" "dist/clipsync-app-${TAG}-linux-x86_64.AppImage"
          cp "$(um target/release/bundle/deb/*.deb)" "dist/clipsync-app-${TAG}-linux-amd64.deb"
          ls -la dist

      - name: renomeia os pacotes do app (windows)
        if: matrix.name == 'windows-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          um() { [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "esperava um arquivo, achei: $*" >&2; exit 1; }; echo "$1"; }
          cp "$(um target/release/bundle/nsis/*-setup.exe)" "dist/clipsync-app-${TAG}-windows-x86_64-setup.exe"
          cp "$(um target/release/bundle/msi/*.msi)" "dist/clipsync-app-${TAG}-windows-x86_64.msi"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publica release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: confere os seis arquivos
        working-directory: dist
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for f in \
            "clipsync-${TAG}-linux-x86_64.tar.gz" \
            "clipsync-${TAG}-windows-x86_64.zip" \
            "clipsync-app-${TAG}-linux-x86_64.AppImage" \
            "clipsync-app-${TAG}-linux-amd64.deb" \
            "clipsync-app-${TAG}-windows-x86_64-setup.exe" \
            "clipsync-app-${TAG}-windows-x86_64.msi"; do
            [ -s "$f" ] || { echo "falta $f" >&2; exit 1; }
          done

      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum clipsync-* > SHA256SUMS

      - name: notas do release
        run: |
          cat > notes.md <<'NOTAS'
          App de desktop (Tauri) e linha de comando para Linux e Windows.

          - App: as nove telas (dispositivos, pareamento, clipboard, layout de telas, diagnóstico, preferências e primeira execução), com o agente dentro do app e ícone na bandeja.
          - Layout de telas: o cursor e o teclado cruzam entre Windows e Linux pelo trecho de borda de monitor ligado na tela Layout, nos dois sentidos, com volta pelo mesmo trecho.
          - Linux: AppImage e .deb. Malha QUIC, pareamento, clipboard e teclado e mouse experimentais (X11 e XWayland).
          - Windows: instalador .exe e .msi, sem assinatura (o SmartScreen avisa). Malha, pareamento, clipboard de texto e, desde a v0.3.0, teclado e mouse com o layout de telas por borda de monitor (atalhos Win+Alt+1 a 9, L e P), tudo experimental.
          - CLI: os mesmos pacotes da v0.1.0.

          Confira o SHA-256 em SHA256SUMS antes de executar.
          NOTAS

      - name: gh release create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "ClipSync $TAG" --notes-file notes.md
